<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On

    # Laravel-handled paths are proxied straight to PHP-FPM's front
    # controller. The original request URI (e.g. /api/categories) is
    # forwarded as-is, so Laravel's own router does the dispatching -
    # no Apache-side rewrite is needed (and a rewrite-to-index.php step
    # would re-enter proxy matching on the rewritten URI and miss these
    # prefixes, sending the request to the front dev server instead).
    #
    # login/logout are registered under /api too (see routes/web.php),
    # specifically so this split can stay a plain URL prefix match: /login
    # is also a real client-side React Router page (visited via GET), so
    # it must never be a prefix that's unconditionally proxied to Laravel.
    ProxyPass "/api" "fcgi://api:9000/var/www/html/public/index.php"
    ProxyPass "/sanctum" "fcgi://api:9000/var/www/html/public/index.php"

    # Laravel's public storage symlink and built assets are real files
    # under DocumentRoot, so exclude them from the SPA catch-all below
    # and let Apache serve them directly.
    ProxyPass "/storage" "!"
    ProxyPass "/build" "!"

    # Vite HMR websocket
    ProxyPass "/@vite" "ws://front:5173/@vite"
    ProxyPassReverse "/@vite" "ws://front:5173/@vite"

    ProxyPass "/" "http://front:5173/"
    ProxyPassReverse "/" "http://front:5173/"
</VirtualHost>
